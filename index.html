<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ff9a8b" />
    <meta name="description" content="Chill Rider — a lo-fi bicycle ride through an endless sunset." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap"
      rel="stylesheet"
    />
    <title>Chill Rider — lo-fi bicycle journey</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <header class="top">
        <div>
          <div class="title">Chill Rider</div>
          <div class="place" id="place">Sunset Boulevard</div>
        </div>
        <div class="stats">
          <div><span id="dist">0.00</span> <small>km</small></div>
          <div class="sub" id="phase">Golden Hour</div>
          <div class="sub" id="best"></div>
        </div>
      </header>

      <div id="toast" class="toast"></div>

      <footer class="bottom">
        <div class="hint" id="hint">
          W pedal · S brake · A/D lean · C cruise · B bell · R radio · N next · H hide
        </div>
        <div class="radio glass" id="radio">
          <button id="radio-toggle" class="radio-btn" aria-label="Toggle radio">▶</button>
          <div class="radio-info">
            <div class="radio-label">CHILL FM <span id="radio-key"></span></div>
            <div class="radio-track" id="radio-track">tap to tune in</div>
          </div>
          <button id="radio-next" class="radio-btn small" aria-label="Next track">⏭</button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
        </div>
        <div class="speed">
          <div class="cruise" id="cruise">CRUISE</div>
          <span id="speed">0</span><small>km/h</small>
        </div>
      </footer>
    </div>

    <div id="touch" class="touch">
      <div class="touch-left">
        <button data-act="back" class="tbtn" aria-label="Lean back">⟲</button>
        <button data-act="forward" class="tbtn" aria-label="Lean forward">⟳</button>
      </div>
      <div class="touch-right">
        <button data-act="brake" class="tbtn" aria-label="Brake">■</button>
        <button data-act="pedal" class="tbtn big" aria-label="Pedal">▲</button>
      </div>
      <button id="t-cruise" class="tbtn mini" aria-label="Cruise control">C</button>
      <button id="t-bell" class="tbtn mini bell" aria-label="Bell">🔔</button>
    </div>

    <div id="start" class="start">
      <div class="start-card">
        <h1>Chill Rider</h1>
        <p>An endless lo-fi bike ride through the golden hour.</p>
        <button id="start-btn" class="start-btn">Start riding</button>
        <p class="small" id="start-hint">Headphones recommended 🎧</p>
      </div>
    </div>

    <div id="pause" class="start hidden">
      <div class="start-card">
        <h1>Paused</h1>
        <p>Take a breath.</p>
        <button id="resume-btn" class="start-btn">Keep riding</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
