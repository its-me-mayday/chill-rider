name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # While Settings → Pages is still "Deploy from a branch", GitHub also publishes the raw
    # sources on every push. Give that build time to finish so the playable game lands last.
    # (Once Pages uses "GitHub Actions" as its source this wait is harmless.)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Let the branch-based Pages build finish first
        run: sleep 60
      - id: deployment
        uses: actions/deploy-pages@v4
