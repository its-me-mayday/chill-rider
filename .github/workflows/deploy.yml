name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The repository may still have "Deploy from a branch" enabled in Settings → Pages,
  # which publishes the raw sources right after every push. Re-deploy the built game
  # once that legacy build has finished so the playable version is always the one served.
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
